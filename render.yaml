# PRÉVIA PROVISÓRIA no Render (plano gratuito) — "New > Blueprint" apontando para este repositório.
# Cria o banco PostgreSQL e o serviço web; migrações e administrador geral são aplicados ao iniciar.
# Limitações do plano gratuito: o serviço hiberna após ~15 min sem uso (1º acesso leva ~30-60 s)
# e o banco gratuito expira em 30 dias. A hospedagem definitiva será outra (ver README).
databases:
  - name: marktvision-db
    plan: free
    databaseName: marktvision
    postgresMajorVersion: "16"

services:
  - type: web
    name: marktvision-leads-ia
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase: { name: marktvision-db, property: connectionString }
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
      - key: PLATFORM_ADMIN_NAME
        value: Administrador Marktvision
      - key: PLATFORM_ADMIN_USERNAME
        value: admin
      - key: PLATFORM_ADMIN_PASSWORD
        sync: false          # o Render pede este valor na criação
      - key: GOOGLE_PLACES_API_KEY
        sync: false
      - key: META_APP_ID
        sync: false
      - key: META_APP_SECRET
        sync: false
      - key: META_WEBHOOK_VERIFY_TOKEN
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: AI_MODEL
        value: claude-sonnet-5-5
